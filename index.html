<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Hard Trainer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <h1>CHASE TRAINER</h1>

        <p>DEAD HARD TRAINING</p>

        <div id="status">
            Press START
        </div>

        <button id="startButton">
            START
        </button>

        <button id="deadHardButton" disabled>
            DEAD HARD
        </button>

        <div id="result"></div>

        <section class="stats">

            <div>
                SCORE
                <strong id="score">0</strong>
            </div>

            <div>
                REACTION
                <strong id="reaction">-- ms</strong>
            </div>

            <div>
                DH STREAK
                <strong id="streak">0</strong>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
